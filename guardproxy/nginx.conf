events {}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    keepalive_timeout 65;
    proxy_read_timeout 600s;
    proxy_connect_timeout 10;
    proxy_send_timeout 600s;

    log_format iptest '$remote_addr | $host | $http_x_forwarded_for | $http_x_real_ip | $request';
    access_log /dev/stdout iptest;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. Required because the proxy_pass below goes through a
    # variable: that is what makes nginx re-resolve open-webui-dk per request
    # instead of once at startup.
    #
    # With a literal "proxy_pass http://open-webui-dk:8080;" nginx resolves the
    # name when the config loads and caches the IP forever. Restarting
    # open-webui-dk gives it a new container IP, and a cached IP would make this
    # proxy serve "connect() failed (113: No route to host)" to every visitor
    # until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        client_max_body_size 10M;

        # Įgaliname priėjimą prie naujo JS failo
        location = /_gp/custom-inject.js {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public";
            default_type application/javascript;
        }

        location = /_gp/GuardPrompt.png {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Meeting-transcription page ("Susitikimų protokolas"). Static, same origin
        # as OpenWebUI, so its fetches to /api/v1/... carry the OWUI auth cookie.
        #
        # LOGIN-GATED: before serving the page, nginx makes an internal auth_request
        # to OWUI's GET /api/v1/auths/ (returns 200 with a valid token cookie, 401
        # without). An unauthenticated visitor is redirected to /auth instead of
        # seeing the form. The API endpoints the page calls are already protected
        # server-side (get_verified_user), so this is defence-in-depth / UX, not the
        # only guard.
        location = /_gp/protokolas.html {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
            # This page requests screen+mic capture (getDisplayMedia/getUserMedia);
            # it must never be framed by another origin (clickjacking a capture grant).
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            default_type text/html;
        }

        # Admin-editable defaults for the protocol page (default model + prompt).
        # Non-sensitive; not gated (like brand.json). Edit protokolas.config.json.
        location = /_gp/protokolas.config.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
            default_type application/json;
        }

        # Internal auth probe for the page above. Proxies to OWUI's current-user
        # endpoint, forwarding only the cookie (no body). Variable proxy_pass +
        # the global resolver so a restarted open-webui-dk is re-resolved (same
        # reason as location / below).
        location = /_gp/_authcheck {
            internal;
            # This auth subrequest runs for the meeting-upload endpoints too, and
            # nginx validates the client body size against THIS location before the
            # subrequest. Without a limit it inherits the ~1m default, so a full
            # meeting upload (e.g. 35 MB) is rejected 413 -> auth_request sees an
            # unexpected status -> the client gets 500. The body is never forwarded
            # (proxy_pass_request_body off), so just allow it through. Keep >= the
            # largest upload location (transcribe_full = 300m).
            client_max_body_size 300m;
            set $gp_authupstream "http://open-webui-dk:8080";
            proxy_pass $gp_authupstream/api/v1/auths/;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Not logged in -> send the visitor to the OpenWebUI login page.
        location @gp_login {
            return 302 /auth;
        }

        # Chunked meeting transcription: the protocol page POSTs ~20 s audio/webm
        # chunks here during a meeting; gp-transcribe VAD-filters + transcribes and
        # returns {text}. Login-gated by the same auth_request. Variable proxy_pass
        # + resolver so a restarted gp-transcribe is re-resolved.
        location = /_gp/transcribe {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_tx "http://gp-transcribe:8000";
            proxy_pass $gp_tx/transcribe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 25m;      # a 20 s webm chunk is well under this
            proxy_read_timeout 120s;
        }

        # Full-file mode: upload the whole meeting recording (returns a job id),
        # then poll status. Login-gated. Big body for a long recording.
        location = /_gp/transcribe_full {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_txf "http://gp-transcribe:8000";
            proxy_pass $gp_txf/transcribe_full;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 300m;     # a long meeting webm
            proxy_read_timeout 300s;
        }
        location ~ ^/_gp/transcribe_status/(.+)$ {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_txs "http://gp-transcribe:8000";
            proxy_pass $gp_txs/transcribe_status/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # Transcribe from a URL (any link, or a SharePoint/OneDrive sharing link).
        location = /_gp/transcribe_url {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_txu "http://gp-transcribe:8000";
            proxy_pass $gp_txu/transcribe_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        # Reversible pseudonymisation for the protocol path (names <-> GP_ tokens).
        location = /_gp/mask {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_pm "http://gp-transcribe:8000";
            proxy_pass $gp_pm/mask;
            proxy_http_version 1.1; proxy_set_header Host $host;
            client_max_body_size 10m;
        }
        location = /_gp/restore {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_pr "http://gp-transcribe:8000";
            proxy_pass $gp_pr/restore;
            proxy_http_version 1.1; proxy_set_header Host $host;
            client_max_body_size 10m;
        }
        # Protocol LLM (correction/summary) with reversible masking, done in the
        # engine to bypass gp-pipeline (which would re-mask our GP_ tokens).
        location = /_gp/llm {
            auth_request /_gp/_authcheck;
            error_page 401 403 = @gp_login;
            set $gp_llm "http://gp-transcribe:8000";
            proxy_pass $gp_llm/llm;
            proxy_http_version 1.1; proxy_set_header Host $host;
            client_max_body_size 10m; proxy_read_timeout 200s;
        }

        # location = /_gp/logo.png {
        #     root /usr/share/nginx/html;
        #     expires 30d;
        #     add_header Cache-Control "public";
        # }

        # Per-deployment branding (customer logo + name). Files are provided
        # locally, not from the repo — see brand.default.json.
        location = /_gp/client-logo.svg {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public";
        }

        location = /_gp/brand.json {
            root /usr/share/nginx/html;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        # Startup gate: until the warm-up container has loaded every local model
        # and written /warmup/ready (shared volume), regular users get a friendly
        # "warming up" page instead of a slow cold first request. `if (-f ...)` is
        # one of the safe uses of `if` (return only). Once the marker exists the
        # condition is false and traffic proxies normally.
        #
        # 502/504 too: after warm-up, if open-webui-dk is momentarily down —
        # e.g. the GPU watchdog (gp-gpu-guard) recycling it to reclaim leaked VRAM,
        # or any restart/crash — nginx can't reach the upstream and generates a 502
        # (connection refused) or 504 (timeout). Without these, users saw a raw
        # nginx error + the SPA's "503" toast. Mapping them to the same friendly
        # page (which self-refreshes every 5s via its meta-refresh) means users see
        # "Sistema ruošiama darbui" and are let straight back in once OWUI is up
        # (~30s). No proxy_intercept_errors: these are nginx-generated connection
        # errors, so error_page catches them without also swallowing OWUI's own
        # legitimate API 5xx responses.
        error_page 502 503 504 /_gp/warming.html;
        location = /_gp/warming.html {
            internal;                       # reachable only via the error_page above
            root /usr/share/nginx/html;
            add_header Retry-After 5 always;
        }

        # OpenWebUI file uploads (meeting recordings attached to notes, KB docs,
        # images) routinely exceed the server-level 10M cap. Under `location /`
        # that cap returns 413, the browser upload to /api/v1/files silently fails,
        # and e.g. a meeting protocol note saves with NO audio attached. Give the
        # file endpoints a large limit; they still authenticate via the OpenWebUI
        # cookie downstream (same as location /). Longest-prefix match wins over /.
        location /api/v1/files {
            if (!-f /warmup/ready) { return 503; }
            client_max_body_size 300m;
            proxy_read_timeout 300s;
            set $gp_files_upstream "http://open-webui-dk:8080";
            proxy_pass $gp_files_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            if (!-f /warmup/ready) {
                return 503;
            }

            # Defence-in-depth security headers for the app shell. (HSTS belongs at
            # the TLS terminator; a Content-Security-Policy can be added there with a
            # policy tailored to the OpenWebUI SPA.)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # Variable + $request_uri on purpose: a variable proxy_pass makes
            # nginx re-resolve the name (see resolver above), but it also stops
            # nginx passing the request URI automatically, so it is appended
            # explicitly. $request_uri keeps the original path AND query string.
            set $gp_upstream "http://open-webui-dk:8080";
            proxy_pass $gp_upstream$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # sub_filter veikia tik jei compression išjungta
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/css text/plain application/javascript;

            # IDEALUS SPRENDIMAS: Įterpiame tik vieną saugią eilutę, kuri paleidžia JS failą
            # Bump ?v=YYYYMMDD whenever custom-inject.js changes: the file is served
            # with a 30-day cache, so without a new URL browsers keep the old copy
            # (users would not see injected UI changes, e.g. the protocol mic button).
            sub_filter "kit.start(app, element);" "kit.start(app, element); const script = document.createElement('script'); script.src = '/_gp/custom-inject.js?v=20260731'; document.head.appendChild(script);";
        }
    }
}
