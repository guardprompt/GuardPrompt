              expression: 'last(/GuardPrompt Platform/gp.qdrant.dead_replicas)>0'
              name: 'qdrant has dead shard replicas (data availability risk)'
              priority: HIGH
              description: |
                Cause: one or more shard replicas are non-active; data availability is at risk.
                Fix: docker logs qdrant; check disk and restart; verify the storage volume health.
        - uuid: bb29f5740f7d4b8192c0fd2e00c1d998
          name: 'qdrant: total vectors'
