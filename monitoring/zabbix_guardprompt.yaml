              name: 'proxy async event loop blocked (CPU-bound work starving I/O)'
              priority: AVERAGE
              description: |
                Cause: CPU-bound work (regex RULES / large payload) starving the single async worker.
                Fix: check payload sizes and mask duration; offload heavy work to an executor; if sustained, add a worker/process.
