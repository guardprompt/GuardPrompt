              parameters:
                - 'probe_success'
                - 'value'
                - ''
          triggers:
            - uuid: 28fb29348cfc42c4a98597c6cb3201f0
              expression: 'last(/GuardPrompt Platform/gp.cert.success)=0'
              name: '{$GP.CERT.TARGET} probe failing (endpoint unreachable)'
              priority: HIGH
              description: |
                Cause: endpoint unreachable or TLS handshake failing.
                Fix: check the front proxy (nginx/NPM) is up; DNS + firewall; cert present. curl -vI {$GP.CERT.TARGET}.

        # ---- LEAK/BLOAT: audit dead tuples + idle-in-tx ---------------------
        - uuid: 01a54262c8144f33a3b1ccc5a8f00585
          name: 'pg: gp_audit dead tuples'
          type: DEPENDENT
          key: 'gp.pg.audit_dead'
          value_type: FLOAT
          master_item:
            key: 'gp.pg.metrics'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'gp_audit_health_dead_tuples'
                - 'value'
                - ''
          triggers:
            - uuid: 6fccf4154abe455ba387c2af93343f61
              expression: 'min(/GuardPrompt Platform/gp.pg.audit_dead,30m)>100000 and last(/GuardPrompt Platform/gp.pg.audit_dead)>2*last(/GuardPrompt Platform/gp.pg.audit_live)'
              name: 'gp_audit bloating (dead tuples >> live; autovacuum not keeping up)'
              priority: AVERAGE
              description: |
                Cause: dead tuples greatly exceed live in gp_audit; autovacuum is behind the heavy prune DELETEs.
                Fix: VACUUM (ANALYZE) gp_audit; tune autovacuum for the table; prune in batches; check GP_AUDIT_TTL_DAYS.
        - uuid: a30a16bb35e0424382032c1bb5502f56
          name: 'pg: gp_audit live tuples'
