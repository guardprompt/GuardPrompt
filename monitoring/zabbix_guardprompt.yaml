        # ---- CAPACITY: disk timeleft ----------------------------------------
        - uuid: 1f64fc0844044ff5ab71cb9bf69ea611
          name: 'host: filesystem avail bytes'
          type: DEPENDENT
          key: 'gp.node.fs_avail'
          value_type: FLOAT
          units: B
          master_item:
            key: 'gp.node.metrics'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'node_filesystem_avail_bytes{mountpoint="{$GP.DISK.MOUNT}"}'
                - 'value'
                - ''
          triggers:
            - uuid: 393c0834bc804e94bfd1b4177bbb7012
              expression: 'timeleft(/GuardPrompt Platform/gp.node.fs_avail,1h,0)<{$GP.DISK.MIN.DAYS}'
              name: 'disk predicted full within {$GP.DISK.MIN.DAYS}'
              priority: HIGH
              description: |
                Cause: growth in docker images/volumes/logs, qdrant or postgres.
                Fix: docker system df; docker image prune; check pg + qdrant volume size; set retention (GP_VAULT_TTL_DAYS, GP_AUDIT_TTL_DAYS, uploads-cleaner) or expand the disk.

        # ---- GPU: vGPU (Grid) LICENCE state ---------------------------------
        # Root-cause catch for the cudaErrorDeviceNotLicensed failure. Fed by the
        # node-exporter textfile collector: the host cron gpu-license-textfile.sh
        # writes node_nvidia_vgpu_licensed (1 licensed, 0 lapsed). This fires the
        # instant the licence lapses — BEFORE gliner errors / fail-closed block
        # users. No value on non-GPU hosts (dev): the nodata clause stays quiet
        # there only if you don't run the cron; disable this trigger on dev.
        - uuid: a1b2c3d4e5f6478890a1b2c3d4e5f603
          name: 'gpu: vGPU Grid licensed'
          type: DEPENDENT
          key: 'gp.node.vgpu_licensed'
          value_type: FLOAT
          master_item:
            key: 'gp.node.metrics'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'node_nvidia_vgpu_licensed'
                - 'value'
                - ''
          triggers:
            - uuid: a1b2c3d4e5f6478890a1b2c3d4e5f604
              expression: 'last(/GuardPrompt Platform/gp.node.vgpu_licensed)=0'
              name: 'vGPU Grid licence LAPSED (all CUDA compute blocked)'
              priority: DISASTER
              description: |
                Meaning: the NVIDIA vGPU (Grid) licence is Unlicensed — the DLS/token
                server is unreachable and the grace period ended. ALL GPU services
                (gliner NER, embeddings, docling) lose CUDA; gliner 500s and the
                platform fail-closes (users blocked, no data leaked).
                Fix: on the host `nvidia-smi -q | grep -i license`; `systemctl status
                nvidia-gridd` (look for "Failed to fetch config token"); check DNS +
                reachability of the DLS token servers and /etc/nvidia/gridd.conf
                ServerAddress; once DNS/DLS is restored `systemctl restart
                nvidia-gridd` and re-check for "Licensed : Yes". This is a host /
                infrastructure issue, not a GuardPrompt bug.

        # ---- CERT expiry (the ha 502 class of problem) ----------------------
        - uuid: d28ff6b633484047bb21cf224d157089
          name: 'cert: earliest expiry (unixtime)'
          type: DEPENDENT
          key: 'gp.cert.expiry'
          value_type: FLOAT
          units: unixtime
          master_item:
            key: 'gp.cert.probe'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'probe_ssl_earliest_cert_expiry'
                - 'value'
                - ''
          triggers:
            - uuid: ef23a41aedbf41ee86bfe1413813a10b
              expression: 'last(/GuardPrompt Platform/gp.cert.expiry)-now()<{$GP.CERT.MIN.DAYS}'
              name: 'TLS cert for {$GP.CERT.TARGET} expires in < {$GP.CERT.MIN.DAYS}'
              priority: HIGH
              description: |
                Cause: the TLS cert on {$GP.CERT.TARGET} is near expiry.
                Fix: renew (Lets Encrypt / NPM / Cloudflare); confirm auto-renew ran; reload the front proxy after renewal.
        - uuid: 7387583237464d108087056f8d2cdf42
          name: 'cert: probe success'
          type: DEPENDENT
          key: 'gp.cert.success'
          value_type: FLOAT
          master_item:
            key: 'gp.cert.probe'
          preprocessing:
