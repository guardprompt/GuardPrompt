                - ''
        - uuid: d006258696e24090a89c5fc6cf3648ba
          name: 'pg: idle-in-transaction connections'
          type: DEPENDENT
          key: 'gp.pg.idle_in_tx'
          value_type: FLOAT
          master_item:
            key: 'gp.pg.metrics'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'gp_pg_idle_in_tx_connections'
                - 'value'
                - ''
          triggers:
            - uuid: c5b46261e2974947ad118be720aa8c52
              expression: 'min(/GuardPrompt Platform/gp.pg.idle_in_tx,10m)>0'
              name: 'idle-in-transaction connections (stuck txn / connection leak)'
              priority: AVERAGE
              description: |
                Cause: a client left a transaction open -> it holds a connection and locks.
                Fix: SELECT * FROM pg_stat_activity WHERE state='idle in transaction'; fix the client to commit/rollback; set idle_in_transaction_session_timeout.

        # ---- qdrant: vector DB (api-key protected /metrics) -----------------
        - uuid: 6cfdf2973bb248ecb81ffe0ef50761d7
          name: 'qdrant: /metrics (raw)'
          type: HTTP_AGENT
          key: 'gp.qdrant.metrics'
          delay: '1m'
          history: '0'
          trends: '0'
          value_type: TEXT
          url: '{$GP.QDRANT.URL}'
          headers:
            - name: 'api-key'
              value: '{$GP.QDRANT.APIKEY}'
        - uuid: bc22c75a4e9d4fbd97346c7d842c35d2
          name: 'qdrant: recovery mode'
          type: DEPENDENT
          key: 'gp.qdrant.recovery'
          value_type: FLOAT
          master_item:
            key: 'gp.qdrant.metrics'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'app_status_recovery_mode'
                - 'value'
                - ''
          triggers:
            - uuid: b2bf06ca02964094a63993243aa127db
              expression: 'last(/GuardPrompt Platform/gp.qdrant.recovery)=1'
              name: 'qdrant started in RECOVERY mode (vector DB degraded)'
              priority: HIGH
              description: |
                Meaning: qdrant booted in RECOVERY mode (interrupted write / corruption / prior OOM); reads and writes may be degraded.
                Fix: docker logs qdrant; ensure free disk and do a clean restart; if it persists, restore the collection from a snapshot. Do not ignore.
            - uuid: a3ff52e9e9274bdea074a780e3aa6cf6
              expression: 'nodata(/GuardPrompt Platform/gp.qdrant.recovery,10m)=1'
              name: 'qdrant /metrics not answering (source down or wrong api-key)'
              priority: HIGH
              description: |
                Cause: qdrant /metrics is not answering; the container is down OR the api-key macro is wrong (401).
                Fix: docker compose ps qdrant; docker logs qdrant; verify {$GP.QDRANT.APIKEY} equals QDRANT_API_KEY in .env; test: curl -H 'api-key: <key>' {$GP.QDRANT.URL}.
        - uuid: 28603fdcd6c5458bb60ced37e37de3b1
          name: 'qdrant: update queue length (indexing backlog)'
          type: DEPENDENT
          key: 'gp.qdrant.queue'
          value_type: FLOAT
          master_item:
            key: 'gp.qdrant.metrics'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                    var t=0,L=value.split(String.fromCharCode(10)),i;
                    for(i=0;i<L.length;i++){if(L[i].indexOf('collection_update_queue_length')===0){var q=L[i].split(' ');t+=parseFloat(q[q.length-1]);}}
                    return t;
          triggers:
            - uuid: 60cf668396354864a009e5ebc648aefd
              expression: 'min(/GuardPrompt Platform/gp.qdrant.queue,10m)>{$GP.QDRANT.QUEUE.MAX}'
              name: 'qdrant indexing backlog (writes outpacing indexing -> stale RAG)'
              priority: AVERAGE
              description: |
                Cause: pending update-queue operations are piling up; indexing cannot keep up, so RAG returns stale or missing results.
                Fix: check ingestion rate and collection_running_optimizations; check GPU/CPU and disk I/O; throttle ingestion or let it drain; scale qdrant if chronic.
        - uuid: cf32484146c544b6bff09f934f5a76f0
          name: 'qdrant: dead shard replicas'
          type: DEPENDENT
          key: 'gp.qdrant.dead_replicas'
          value_type: FLOAT
          master_item:
            key: 'gp.qdrant.metrics'
