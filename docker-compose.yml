  #     - openwebui_net
 
  docling-serve:
    build:
      # docling_api.py has its own build context so its runtime package is placed
      # beside the module (COPY . /app/ in the Dockerfile below).
      context: ./docling-serve
      dockerfile_inline: |
        # # Use the latest 2026 CUDA image
        # FROM ghcr.io/docling-project/docling-serve-cu128

        # USER root

        # # 🔠 Tesseract + LT language
        # RUN dnf -y install epel-release && \
        #     dnf -y install tesseract tesseract-langpack-lit wget mesa-libGL && \
        #     mkdir -p /usr/share/tesseract/tessdata && \
        #     wget -O /usr/share/tesseract/tessdata/osd.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata && \
        #     wget -O /usr/share/tesseract/tessdata/lit.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/lit.traineddata && \
        #     dnf clean all

        # # Install extra libraries and make sure PyTorch sees CUDA
        # RUN pip install --no-cache-dir docling[asr] pypdfium2 fastapi uvicorn pillow pymupdf img2pdf beautifulsoup4 lxml requests charset-normalizer chardet defusedxml

        # WORKDIR /app
        # # Copy the API file (at Docker build time)
        # COPY docling_api.py /app/docling_api.py

        # # Environment settings inside the container
        # ENV TESSDATA_PREFIX=/usr/share/tesseract/tessdata
        # ENV DOCLING_SERVE_ENABLE_UI=1
        # # Force Docling to use the CUDA device (0 = first GPU)
        # ENV CUDA_VISIBLE_DEVICES=0
        # ENV TRANSFORMERS_VERBOSITY=info

        # RUN python -m pip install --no-cache-dir --upgrade --no-deps "docling" "docling-core" "docling-parse" "docling-ibm-models"

        # # Important: run uvicorn as the main process
        # CMD ["uvicorn", "docling_api:app", "--host", "0.0.0.0", "--port", "8001"]

        # # Return to a safe user if needed, but root ensures access to GPU libraries
        # USER root

        # Pinned by DIGEST, not :main — the steps below depend on this image's
        # internals (dnf/EPEL package names, the /opt/app-root/bin/python venv
        # path). A moving tag can change those under a customer and break their
        # build. Bump deliberately:
        #   docker buildx imagetools inspect ghcr.io/docling-project/docling-serve-cu128:main --format '{{.Manifest.Digest}}'
        FROM ghcr.io/docling-project/docling-serve-cu128@sha256:f62e3036c4c0ade1ffa3823053f029a7cc4ad57524a27e0021dd471013311b02

        USER root

        RUN dnf -y install epel-release && \
            dnf -y install tesseract tesseract-langpack-lit wget mesa-libGL && \
            mkdir -p /usr/share/tesseract/tessdata && \
            wget -O /usr/share/tesseract/tessdata/osd.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata && \
            wget -O /usr/share/tesseract/tessdata/lit.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/lit.traineddata && \
            dnf clean all

        RUN /opt/app-root/bin/python -m pip install --no-cache-dir --upgrade \
            pymupdf img2pdf beautifulsoup4 lxml chardet charset-normalizer defusedxml psycopg2-binary

        RUN /opt/app-root/bin/python - <<'PY'
        import docling
        print("docling import OK")
        PY

        WORKDIR /app
        # Copy the whole context so docling_api.py and its runtime package are
        # placed together (.dockerignore trims junk).
        COPY . /app/

        ENV TESSDATA_PREFIX=/usr/share/tesseract/tessdata
        ENV CUDA_VISIBLE_DEVICES=0
        ENV TORCH_CUDA_ARCH_LIST=12.0

        CMD ["uvicorn", "docling_api:app", "--host", "0.0.0.0", "--port", "8001"]

        USER root

    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8777:8001"
    environment:
      # ✅ GPU and language settings
      # cuda by default; set DOCLING_DEVICE=cpu in .env on hosts where the GPU
      # driver is too old for the container's CUDA (e.g. vGPU driver 12.2 vs torch cu128).
      DOCLING_DEVICE: "${DOCLING_DEVICE:-cuda}"
      DOCLING_OCR_ENGINE: "paddleocr"
      # Tell Tesseract to use Lithuanian (if the API supports it via config)
      OCR_LANG: "lit"

      # Efficiency
      DOCLING_NUM_THREADS: "4"
      DOCLING_OCR_BATCH_SIZE: "16"
      # Per-process GPU VRAM cap in GB (default 6). Raise on a roomy GPU.
      DOCLING_CUDA_MEM_GB: "${DOCLING_CUDA_MEM_GB:-6}"
      # Same VMM-free anti-fragmentation as gliner/OWUI: release the caching
      # allocator's idle OCR/layout batch blocks (docling holds ~5.6GB otherwise —
      # PaddleOCR + layout + tableformer models + cached buffers). gc fires at
      # 0.8 x DOCLING_CUDA_MEM_GB cap. NOT expandable_segments (vGPU has no VMM).
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128,garbage_collection_threshold:0.8"

      # LLM integration (configurable via .env — LM Studio is Windows-only;
      # on Ubuntu point LM_STUDIO_URL to vLLM/Ollama/OpenRouter or disable)
      LM_STUDIO_ENABLED: "${LM_STUDIO_ENABLED:-true}"
      LM_STUDIO_URL: "${LM_STUDIO_URL:-http://host.docker.internal:1234/v1/chat/completions}"
      LM_MODEL: "${LM_MODEL:-google/gemma-3-4b}"
      DOCLING_DOCUMENT_TIMEOUT: "900"

      # ✅ Speech recognition (ASR) with Whisper
      DOCLING_ENABLE_ASR: "true"
      # Tell Whisper to use the GPU
      ASR_DEVICE: "${ASR_DEVICE:-cuda}"
      # Force Lithuanian for transcription (Whisper auto-detects, but forcing is safer)
      ASR_LANG: "lt"

      # Hidden-text (anti prompt-injection) redaction. On a TRUSTED internal KB it
      # false-positives on slide-deck / PPT accessibility text (contrast 0.00) and
      # shreds real content into [PROTECTION]. Set to false for LOG-ONLY (detect +
      # log, don't corrupt) — recommended for the KB corpus; the anonymizer + the
      # semantic-injection layer still run.
      DOCLING_HIDDEN_REDACT: "${DOCLING_HIDDEN_REDACT:-true}"
      # HARM CHECK: when redacting, don't blindly blank EVERY invisible span (that
      # shreds legit slide headings / accessibility duplicates). Ask the local LLM
      # (LM_STUDIO_URL) whether the hidden text is an actual prompt-injection and
      # redact ONLY if malicious; benign hidden content is kept. Fails CLOSED (redacts)
      # when the LLM is unavailable, so protection is never silently dropped.
      DOCLING_HIDDEN_HARM_CHECK: "${DOCLING_HIDDEN_HARM_CHECK:-true}"

      # Postgres for the per-conversion image-session registry that drives PII-image
      # cleanup. This env was MISSING entirely, so docling_api.py fell back to the
      # default password "guardprompt" and postgres rejected it ("password
      # authentication failed") — image sessions never registered, cleanup broke.
      # Same DB_URL every other service uses (uploads-cleaner/kb-admin).
      DB_URL: "postgresql://${POSTGRES_USER_ENV}:${POSTGRES_PASSWORD_ENV}@postgres:5432/${POSTGRES_DB_ENV}"
    volumes:
      # Live docling_api.py from its own dir; its runtime package comes from the
      # image (COPY . /app/), so no root runtime mount here. READ-ONLY: the
      # container runs as root, so a writable code mount + any upload-path slip
      # would be RCE-on-restart. :ro makes overwriting the code impossible.
      - ./docling-serve/docling_api.py:/app/docling_api.py:ro
      - ./models_cache:/root/.cache/huggingface
      - docling_images:/app/images
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - openwebui_net
    cap_drop:
      - NET_RAW
    extra_hosts:
    - "host.docker.internal:host-gateway"

  # --- NEW: periodic upload cleanup; DAP safeguard against unnecessary data retention ---
  uploads-cleaner:
    build:
      context: ./uploads-cleaner
    container_name: uploads-cleaner
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DB_URL=postgresql://${POSTGRES_USER_ENV}:${POSTGRES_PASSWORD_ENV}@postgres:5432/${POSTGRES_DB_ENV}
      - DELETE_AFTER_DAYS=${CLEANER_DELETE_AFTER_DAYS:-30}
      - RUN_HOUR=${CLEANER_RUN_HOUR:-2}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_FILES_COLLECTION=open-webui_files
    volumes:
      - ./uploads-cleaner/cleaner.py:/app/cleaner.py:ro
      # Runtime package that cleaner.py imports; mounted from the repo root.
      - ./pyarmor_runtime_007592:/app/pyarmor_runtime_007592:ro
      - open-webui-data:/app/backend/data
    networks:
      - openwebui_net
    depends_on:
      - postgres
      - qdrant
    cap_drop:
      - NET_RAW

  # --- KB Admin App: admin pult to curate KBs from Confluence/Jira/SharePoint
  # and assign access. Sole orchestrator (runs oikb as a subprocess internally).
  # Plan: KB-ADMIN-APP-PLAN.md ---
  kb-admin:
    build:
      context: ./kb-admin
    container_name: kb-admin
    restart: unless-stopped
    environment:
      - AUTH_MODE=${KBADMIN_AUTH_MODE:-openwebui}
      # No fallback: kb-admin refuses to start on a placeholder secret (cookie-forge
      # protection). The installer generates KBADMIN_SESSION_SECRET into .env.
      - SESSION_SECRET=${KBADMIN_SESSION_SECRET:-}
      - ADMIN_FALLBACK_EMAILS=${KBADMIN_ADMIN_EMAILS:-}
      - OPEN_WEBUI_URL=http://open-webui-dk:8080
      - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY:-}
      # Self-healing auth: if the API key is missing/rotated, kb-admin signs in with these
      # admin credentials to get a fresh token automatically (set ONCE, survives rotation).
      - OPEN_WEBUI_ADMIN_EMAIL=${OPEN_WEBUI_ADMIN_EMAIL:-}
      - OPEN_WEBUI_ADMIN_PASSWORD=${OPEN_WEBUI_ADMIN_PASSWORD:-}
      - DB_URL=postgresql://${POSTGRES_USER_ENV}:${POSTGRES_PASSWORD_ENV}@postgres:5432/${POSTGRES_DB_ENV}
      - DB_SCHEMA=kbadmin
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - CONFLUENCE_URL=${CONFLUENCE_URL:-}
      - CONFLUENCE_USER=${CONFLUENCE_USER:-}
      - CONFLUENCE_TOKEN=${CONFLUENCE_TOKEN:-}
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_USER=${JIRA_USER:-}
      - JIRA_TOKEN=${JIRA_TOKEN:-}
      - SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID:-}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID:-}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET:-}
      - NOTIFY_URL=${NOTIFY_URL:-}
      # License validation (same machine key + backend as anonymizer)
      - LICENSING_URL_ENV=${LICENSING_URL_ENV:-}
      - MACHINE_KEY_PATH=/app/machine_key.txt
      # Brand-kit sync destination = the sandbox presentation brand volume.
      - BRAND_KIT_DEST=/home/user/.gpbrand/kit
      - BRAND_KIT_EXTENSIONS=${BRAND_KIT_EXTENSIONS:-}
      - BRAND_KIT_MAX_MB=${BRAND_KIT_MAX_MB:-50}
    volumes:
      # Reuse the GuardPrompt machine key (one license per machine)
      - ./anonymizer/machine_key.txt:/app/machine_key.txt:ro
      # Write official brand assets into the sandbox brand volume (files only —
      # NOT a KB, NOT anonymized). Shared with open-terminal.
      - open-terminal-data:/home/user
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      - postgres
      - open-webui-dk
    networks:
      - openwebui_net
    cap_drop:
      - NET_RAW

  # n8n:
  #   image: n8nio/n8n:latest
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:5678:5678"
  #   environment:
  #     # --- DB (reuse the same Postgres) ---
  #     DB_TYPE: postgresdb
  #     DB_POSTGRESDB_HOST: postgres
  #     DB_POSTGRESDB_PORT: 5432
  #     DB_POSTGRESDB_DATABASE: n8n
  #     DB_POSTGRESDB_USER: ${POSTGRES_USER_ENV}
  #     DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD_ENV}

  #     # --- n8n runtime ---
  #     NODE_ENV: production
  #     GENERIC_TIMEZONE: Europe/Vilnius

  #     # --- Security ---
  #     N8N_BASIC_AUTH_ACTIVE: "true"
  #     N8N_BASIC_AUTH_USER: n8nadmin
  #     N8N_BASIC_AUTH_PASSWORD: ${N8N_ADMIN_PASSWORD}

  #     # --- URL ---
  #     N8N_HOST: localhost
  #     N8N_PORT: 5678
  #     N8N_PROTOCOL: http

  #     # --- Hardening ---
  #     EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
  #     EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
  #     EXECUTIONS_DATA_MAX_AGE: 168
  #     EXECUTIONS_DATA_PRUNE: "true"

  #   volumes:
  #     - n8n_data:/home/node/.n8n
  #   networks:
  #     - openwebui_net
  #   depends_on:
  #     - postgres
  #   cap_drop:
  #     - NET_RAW
  #   env_file:
  #     - .env

  # --- Ollama: local vision LLM for docling image captions (Ubuntu replacement
  #     for Windows-only LM Studio). Starts only with:  --profile ollama
  #     OLLAMA_KEEP_ALIVE controls how long the captioning model stays resident.
  #     "-1" pinned it in VRAM forever (~5GB) — fine on a dedicated card, but this
  #     GPU is shared (gliner + OWUI embed/reranker + docling + transcribe), and a
  #     permanently-pinned gemma3:4b left too little headroom -> gliner CUDA OOM ->
  #     gp-claude-proxy fail-closed -> 503 for ALL chat. "5m" unloads it after 5
  #     min idle (frees ~5GB) and reloads on the next caption request; captions in
  #     a batch stay warm. Trade a little first-caption latency for a stable GPU. ---
  ollama:
    image: ollama/ollama:0.31.2
    container_name: ollama
    profiles: ["ollama"]
    restart: unless-stopped
    # Hard CPU cap: if gemma can't fit VRAM and Ollama offloads the vision-caption
    # model to CPU, one image caption is a ~45 s inference that otherwise saturates
    # 6+ cores and takes the whole host to 100% (load avg >5) during an image-heavy
    # KB ingest. Capping to 2 CPUs makes a CPU-fallback caption slow but harmless —
    # the box stays responsive. Real fix is VRAM headroom (see comment above); this
    # is the guardrail so a CPU meltdown can never recur.
    cpus: "2"
    environment:
      # Shrink gemma3:4b's VRAM footprint so it FITS the shared GPU (a 3.3GB model
      # was taking ~5GB because Ollama loaded it with a 32768 context AND multiple
      # parallel slots -> KV-cache = ctx x parallel x layers). docling image
      # captioning needs a tiny context (image + short prompt + short caption), so
      # cap it: 1 parallel slot, 4096 context, one loaded model. Brings it to ~3.5GB.
      # PINNED resident (KEEP_ALIVE=-1) so captions are always fast, no reload/CPU
      # fallback during KB ingest (operator's choice — no cold-start latency).
      # TRADE-OFF: ollama's llama-server leaks host RAM on the multimodal caption
      # path (~11.5GB over a big ingest; not fixed by 0.31.2, pin means it never
      # self-clears). RAM isn't tight (62GB host), so accepted; clear it with a
      # periodic `docker restart ollama` (off-hours timer) if it ever matters.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Flash Attention + q8_0 KV-cache quantization cut KV-cache VRAM ~30-50% at
      # negligible quality cost (perplexity +0.002..0.05). KV quant ONLY applies
      # when flash attention is ON, so both are set together. gemma3 supports it;
      # if a future model's arch isn't on Ollama's allowlist it silently uses f16.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - openwebui_net

  # ==========================================================================
  # Monitoring exporters (Zabbix HTTP-agent scrapes each /metrics). See
  # MONITORING-PLAN.md. Ports bound to loopback; at work, either run the Zabbix
  # server/agent on this host or publish these on the management LAN.
  # ==========================================================================

  # Host CPU/mem/disk/net. On Docker Desktop this sees the WSL2 VM, not Windows;
  # on the native Ubuntu work host it sees the real box incl. / and /srv.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host/sys|host/proc)($$|/)'
      # Textfile collector: exposes metrics that HTTP scraping can't reach —
      # notably the vGPU Grid LICENSE state, which no exporter reports and which
      # gliner_model_on_gpu CANNOT catch (that gauge is set once at startup and
      # stays 1 after a runtime licence drop). A host cron writes
      # node_nvidia_vgpu_licensed into ./monitoring/textfile via
      # monitoring/gpu-license-textfile.sh. See MONITORING.md.
      - '--collector.textfile.directory=/textfile'
    pid: host
    volumes:
      # ':ro' (not ':ro,rslave') — Docker Desktop rejects rslave propagation.
      # On the native Ubuntu work host, ',rslave' can be re-added for full
      # nested-mount visibility (e.g. distinguishing / from /srv cleanly).
      - /:/host:ro
      # Prometheus textfile drop-dir (host cron writes *.prom here; read-only in).
      - ./monitoring/textfile:/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - openwebui_net

  # Per-container mem/cpu/net/fd + OOMKilled + restarts (leak/quality triggers).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - openwebui_net

  # Postgres: connections, per-DB size, pg_stat_* + the custom usage/bloat
  # queries in monitoring/pg_queries.yaml (gp_audit usage, dead tuples, vault).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER_ENV}:${POSTGRES_PASSWORD_ENV}@postgres:5432/${POSTGRES_DB_ENV}?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/queries.yaml
    volumes:
      - ./monitoring/pg_queries.yaml:/queries.yaml:ro
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres
    networks:
      - openwebui_net

  # Synthetic probes: external deps (OpenRouter/Anthropic/embeddings), cert
  # expiry, end-to-end health. Zabbix calls /probe?target=..&module=..
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/config/blackbox.yml'
    volumes:
      - ./monitoring/blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - openwebui_net

  # GPU util/VRAM/temp/ECC. WORK-TARGET: needs a real NVIDIA runtime; on Docker
  # Desktop it usually will NOT start, and on a vGPU guest (L40S) telemetry is
  # limited. Start it only where DCGM is supported: `docker compose up -d
  # dcgm-exporter`. Pick the image tag matching the host driver/DCGM version.
  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      - "127.0.0.1:9400:9400"
    networks:
      - openwebui_net

  # ---- Zabbix (monitoring server + web UI + its own DB) --------------------
  # Scrapes the /metrics sources over openwebui_net by container name.
  zabbix-postgres:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${ZABBIX_DB_USER:-zabbix}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD not set - run install.sh/install.ps1 or set it in .env}
      - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - zabbix_pgdata:/var/lib/postgresql/data
    networks:
      - openwebui_net

  zabbix-server:
    # 7.0 LTS by default (matches the corporate server). Bumping from a 6.0
    # volume triggers an in-place DB schema upgrade on first start — supported
    # 6.0 LTS -> 7.0 LTS. Override with ZBX_VERSION in .env.
    image: zabbix/zabbix-server-pgsql:alpine-${ZBX_VERSION:-7.0-latest}
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_USER=${ZABBIX_DB_USER:-zabbix}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD not set - run install.sh/install.ps1 or set it in .env}
      - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
    ports:
      - "127.0.0.1:10051:10051"
    depends_on:
      - zabbix-postgres
    networks:
      - openwebui_net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-${ZBX_VERSION:-7.0-latest}
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_USER=${ZABBIX_DB_USER:-zabbix}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD:?ZABBIX_DB_PASSWORD not set - run install.sh/install.ps1 or set it in .env}
      - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
      - PHP_TZ=Europe/Vilnius
    ports:
      - "127.0.0.1:8880:8080"
    depends_on:
      - zabbix-server
      - zabbix-postgres
    networks:
      - openwebui_net

  # ---- Zabbix PROXY (OPT-IN: forward metrics to a CORPORATE Zabbix) ---------
  # Does NOT start by default (behind a profile). Start it with:
  #   docker compose --profile external-zabbix up -d zabbix-proxy
  # An ACTIVE proxy joined to openwebui_net: it scrapes the same internal
  # /metrics by container name and connects OUTBOUND (one port) to your company
  # Zabbix server — so nothing new is exposed and the 127.0.0.1 hardening stays
  # intact. PSK-encrypted. The bundled zabbix-server/web above may keep running
  # for a local view, or be stopped once the corporate server owns monitoring:
  #   docker compose stop zabbix-server zabbix-web
  # Full steps: ZABBIX-INTEGRATION.md.
  zabbix-proxy:
    # The proxy MAJOR must match your corporate Zabbix SERVER major — a 6.0 proxy
    # cannot talk to a 7.0 server. Defaults to 7.0 (our target); override via
    # ZBX_PROXY_VERSION in .env if your server differs. (The bundled standalone
    # zabbix-server above is also 7.0 now, but talks to nobody external.)
    image: zabbix/zabbix-proxy-sqlite3:alpine-${ZBX_PROXY_VERSION:-7.0-latest}
    container_name: zabbix-proxy
    profiles: ["external-zabbix"]
    restart: unless-stopped
    environment:
      - ZBX_PROXYMODE=0                                  # 0 = ACTIVE (proxy connects OUT to the server)
      - ZBX_SERVER_HOST=${CORP_ZABBIX_SERVER:-}          # your company Zabbix server / its proxy address
      - ZBX_SERVER_PORT=${CORP_ZABBIX_PORT:-10051}
      - ZBX_HOSTNAME=${ZBX_PROXY_NAME:-GuardPrompt-proxy}  # MUST match the Proxy name created in corporate Zabbix
      - ZBX_TLSCONNECT=psk
      - ZBX_TLSACCEPT=psk
      - ZBX_TLSPSKIDENTITY=${ZBX_PROXY_PSK_ID:-GuardPrompt-proxy}
      - ZBX_TLSPSKFILE=/var/lib/zabbix/enc/proxy.psk
    volumes:
      # Generate before first start (see ZABBIX-INTEGRATION.md):
      #   openssl rand -hex 32 > monitoring/zabbix_proxy.psk
      - ./monitoring/zabbix_proxy.psk:/var/lib/zabbix/enc/proxy.psk:ro
    cap_drop:
      - NET_RAW
    networks:
      - openwebui_net

  # --- Open Terminal: sandboxed command execution for AI agents inside
  # OpenWebUI. Registered in OpenWebUI under Admin -> Integrations ->
  # Open Terminal (URL http://open-terminal:8000, key = OPEN_TERMINAL_API_KEY).
  #
  # SECURITY MODEL (Open Terminal's own): safety comes from the container being
  # disposable + host-isolated + egress-controlled, NOT from an in-container jail.
  #  * No docker.sock mount -> sandbox cannot touch host Docker / other containers
  #    (the README's optional docker.sock mount is a root-equivalent hole; omitted).
  #  * Egress firewall (OPEN_TERMINAL_ALLOWED_DOMAINS) -> default "" = block ALL
  #    outbound, so nothing read in the sandbox can be exfiltrated. Whitelist
  #    domains (e.g. "pypi.org,files.pythonhosted.org") to allow specific installs.
  #    Package pre-install (below) runs BEFORE the firewall, so deps still fetch.
  #  * Port bound to loopback; resource caps; NET_RAW dropped.
  #  * API key required -> only OpenWebUI (which holds the key) can drive it.
  #
  # SINGLE-USER on purpose. MULTI_USER=true (per-OpenWebUI-user Linux account +
  # home) sounds ideal for "confine each user to their own dir", but on a Docker
  # named volume the per-user UIDs and the volume's stored ownership drift apart,
  # so `sudo -u <user>` writes get Permission denied and FILE UPLOADS FAIL. Not
  # worth a broken sandbox. Real per-user *container* isolation = licensed
  # "Terminals". Confinement here is: disposable container + no host mounts +
  # egress blocked. no-new-privileges is NOT set because the egress firewall
  # needs sudo/iptables at startup (no-new-privileges would break it).
  #
  # ANONYMIZATION: terminal output returns to the model as role="tool" messages;
  # gp-pipeline.py masks tool-role content, so command output is
  # anonymized before it reaches the LLM (incl. external OpenRouter). Do not
  # disable the GuardPrompt Anonymizer filter while this service is enabled.
  open-terminal:
    # Custom image = upstream Open Terminal + baked office/PDF/data toolset
    # (see open-terminal/Dockerfile). Built by install.sh/.ps1 on first install.
    build:
      context: ./open-terminal
    image: localai-open-terminal
    container_name: open-terminal
    restart: unless-stopped
    # Root INSIDE the container (not host root). Needed so the egress firewall's
    # `capsh --drop` (CAP_SETPCAP) works at startup; as uid 1000 it crash-loops
    # with "unable to raise CAP_SETPCAP". Single-user, so the session writes to
    # /home/user directly as root -> uploads work (no multi-user sudo -u drift).
    user: "0:0"
    ports:
      # Host 8011 -> container 8000 (host 8000 is used elsewhere on some hosts).
      # OpenWebUI reaches it in-network as http://open-terminal:8000 regardless.
      - "127.0.0.1:8011:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}
      # Egress policy (bare var = pass through only if set in .env, else omit):
      #   unset in .env      -> full internet (needed on Docker Desktop/WSL2, whose
      #                         kernel lacks the ip_set module the whitelist needs)
      #   set to ""          -> block ALL outbound (plain iptables, works anywhere)
      #   set to "a,b,c"     -> whitelist (ipset+dnsmasq; needs ip_set = native
      #                         Linux host, e.g. the production Ubuntu server)
      - OPEN_TERMINAL_ALLOWED_DOMAINS
      # Dev tools pre-installed here fetch BEFORE the egress firewall locks down.
      # Add what your users need; keep it lean to limit image bloat / attack area.
      - OPEN_TERMINAL_PIP_PACKAGES=${OPEN_TERMINAL_PIP_PACKAGES-}
      - OPEN_TERMINAL_NPM_PACKAGES=${OPEN_TERMINAL_NPM_PACKAGES-}
      - OPEN_TERMINAL_PACKAGES=${OPEN_TERMINAL_PACKAGES-}
    volumes:
      - open-terminal-data:/home/user
    cap_add:
      - NET_ADMIN                    # for the startup egress iptables/dnsmasq (dropped after via capsh)
    cap_drop:
      - NET_RAW
    deploy:
      resources:
        limits:
          # Ceiling only (bites under load). A code sandbox runs builds,
          # npm/pip installs and data-science libs — 2G OOMs those fast.
          # Raise memory to 12-16g for heavy data work; lower cpus if the
          # host is contended by the GPU AI services.
          cpus: "4.0"
          memory: 8g
    networks:
      - openwebui_net

  # --- Open Terminal role-aware proxy. OpenWebUI is pointed at THIS (not the
  # sandbox directly); it forwards the authenticated user identity (X-User-Id
  # header on HTTP, user_id query on WS). Only OpenWebUI ADMINS may run install/
  # privileged (sudo) commands: non-admin /execute commands matching the block
  # list are refused (403), and non-admin interactive WebSocket sessions are
  # refused. Admins pass through unchanged. See open-terminal-proxy/app.py.
  # (Blocklist = casual-misuse guard, not a hard boundary; pair with the sandbox
  # egress firewall for a hard guarantee.)
  open-terminal-proxy:
    build:
      context: ./open-terminal-proxy
    container_name: open-terminal-proxy
    restart: unless-stopped
    depends_on:
      - open-terminal
      - postgres
    environment:
      - OT_UPSTREAM=http://open-terminal:8000
      # Read-only role lookup against OpenWebUI's user table.
      - OT_DB_DSN=postgresql://${POSTGRES_USER_ENV}:${POSTGRES_PASSWORD_ENV}@postgres:5432/${POSTGRES_DB_ENV}
      # Override the admin-only command pattern if needed (bare = use app.py default).
      - OT_BLOCK_REGEX
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - openwebui_net

  # --- Brand-kit sync: mirrors a SharePoint document library (official visual
  # identity: logos, brand PPT templates, photos) into the sandbox brand volume
  # at /home/user/.gpbrand/kit, as plain FILES. Deliberately does NOT touch any
  # Knowledge Base and does NOT run assets through the anonymizer (brand identity
  # is public corporate material; anonymizing would corrupt it).
  #
  # Admin-only: config lives in .env (SHAREPOINT_* + BRAND_KIT_*), which only host
  # admins can edit. Not started by default (profile). Run on demand:
  #   docker compose run --rm brand-kit-sync
  # or set BRAND_KIT_INTERVAL>0 and start it as a scheduled service.
  # NOTE: the SharePoint app registration must be in the SAME tenant as the site.
  brand-kit-sync:
    build:
      context: ./brand-kit
    container_name: brand-kit-sync
    profiles: ["tools"]
    environment:
      - SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID:-}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID:-}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET:-}
      - BRAND_KIT_SITE_HOST=${BRAND_KIT_SITE_HOST:-}
      - BRAND_KIT_SITE_PATH=${BRAND_KIT_SITE_PATH:-}
      - BRAND_KIT_LIBRARY=${BRAND_KIT_LIBRARY:-}
      - BRAND_KIT_FOLDER=${BRAND_KIT_FOLDER:-}
      - BRAND_KIT_DEST=${BRAND_KIT_DEST:-/home/user/.gpbrand/kit}
      - BRAND_KIT_EXTENSIONS=${BRAND_KIT_EXTENSIONS:-}
      - BRAND_KIT_INTERVAL=${BRAND_KIT_INTERVAL:-0}
      - BRAND_KIT_MAX_MB=${BRAND_KIT_MAX_MB:-50}
    volumes:
      - open-terminal-data:/home/user
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - openwebui_net
    restart: "no"


networks:
  openwebui_net:
    driver: bridge

volumes:
  zabbix_pgdata:
  pgdata:
  qdrant_storage:
  open-webui-data:
  # netdataconfig:
  # netdatalib:
  # n8n_data:
  docling_images:
  ollama_models:
  gliner_hf_cache:
  gp_transcribe_cache:
  warmup_state:
  open-terminal-data: