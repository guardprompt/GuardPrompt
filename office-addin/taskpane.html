<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="taskpane.css" />
  <title>GuardPrompt AI</title>
  <!-- Office.js: the bridge to read/write the Word document or Outlook mail. Loaded
       from Microsoft's CDN (required — Office injects the host-specific runtime). -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header>
    <div class="brandrow">
      <img id="brandLogo" class="brandlogo" alt="" />
      <span class="brand" id="brandName">GuardPrompt AI</span>
    </div>
    <div class="modelrow">
      <select id="model" title="Modelis"></select>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <section id="actions">
    <button class="act" data-op="anon">🛡️ Anonimizuok pažymėtą</button>
    <button class="act" data-op="rewrite">✍️ Perrašyk oficialiau</button>
    <button class="act" data-op="reply">✉️ Paruošk atsakymą</button>
    <button class="act" data-op="summary">📄 Apibendrink</button>
    <button class="act wide" id="useDocs">🔎 Naudok mano dokumentus</button>
  </section>

  <footer>
    <textarea id="q" rows="2" placeholder="Klausk apie savo dokumentus, arba nurodymas pažymėtam tekstui…"></textarea>
    <div class="btnrow">
      <button id="send">Siųsti</button>
      <button id="stop" class="hidden stopbtn">⏹ Stabdyti</button>
    </div>
    <p class="muted" id="note">Turinys anonimizuojamas prieš išorinį LLM.</p>
  </footer>

  <script src="env-config.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
