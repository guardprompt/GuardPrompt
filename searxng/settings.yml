use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

languages:
  - lt

engines:
  - name: yacy images
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: radio browser
    disabled: true
  # DuckDuckGo CAPTCHA-blocks self-hosted SearXNG IPs ("CAPTCHA (lt-lt)") — it returns
  # nothing but error noise, so disable it. Google/Bing/Brave (defaults) still serve results.
  - name: duckduckgo
    disabled: true

botdetection:
  enabled: false
